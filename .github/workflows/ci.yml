name: CI

# 校验每次改动，并把可下载的构建产物挂到这次运行上。
# 正式发布走 release.yml（v* tag），这里只产出可检查的壳与演示游戏包。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 静态检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      # 先把演示游戏放进壳的 public 目录，再构建壳；
      # 否则 dist 里只有空货架，产物拿到手也玩不了。
      - name: 构建演示游戏
        run: pnpm demo

      - name: 构建
        run: pnpm build

      - name: 打包演示游戏
        run: pnpm pack:game demo "${RUNNER_TEMP}/hearthbox-demo.hbx"

      - name: 上传壳产物
        uses: actions/upload-artifact@v4
        with:
          name: hearthbox-shell
          path: apps/shell/dist/
          retention-days: 7

      - name: 上传演示游戏包
        uses: actions/upload-artifact@v4
        with:
          name: hearthbox-demo-hbx
          path: ${{ runner.temp }}/hearthbox-demo.hbx
          retention-days: 7

      - name: 安装浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 端到端测试
        run: pnpm exec playwright test --reporter=line

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
