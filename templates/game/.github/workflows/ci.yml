name: CI

# 每次改动都构建一次，并把 .hbx 挂到运行产物里，方便直接下载、手动装进壳里试。
# 正式发版走 release.yml（v* tag）。
on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SDK 还没发布到 npm，构建前必须从平台仓库取同一份源码。
  HEARTHBOX_REPO: soldier-cv/hearthbox
  HEARTHBOX_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 取平台
        env:
          HEARTHBOX_TOKEN: ${{ secrets.HEARTHBOX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${HEARTHBOX_TOKEN:-}" ]; then
            git clone --depth 1 --branch "$HEARTHBOX_REF" \
              "https://x-access-token:${HEARTHBOX_TOKEN}@github.com/${HEARTHBOX_REPO}.git" ../hearthbox
          else
            git clone --depth 1 --branch "$HEARTHBOX_REF" \
              "https://github.com/${HEARTHBOX_REPO}.git" ../hearthbox
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建平台 SDK
        run: |
          set -euo pipefail
          cd ../hearthbox
          pnpm install --frozen-lockfile
          pnpm --filter @hearthbox/sdk build

      - name: 安装游戏依赖
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 打包 .hbx
        run: node ../hearthbox/scripts/pack-game.mjs .

      - name: 上传游戏包
        uses: actions/upload-artifact@v4
        with:
          name: game-hbx
          path: '*.hbx'
          retention-days: 7
